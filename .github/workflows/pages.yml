name: Publish velie.ru

# The site is pulled from the private Laboratory/velie-src with a read-only
# deploy key; this public repo only keeps CNAME, Yandex verification, icons
# and this workflow. Sources never live here.
on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '0 */6 * * *'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          path: site
      - name: Checkout private sources
        uses: actions/checkout@v4
        with:
          repository: Laboratory/velie-src
          ssh-key: ${{ secrets.VELIE_SRC_KEY }}
          path: src
          persist-credentials: false
      - name: Assemble
        run: |
          mkdir -p _site/images
          # the site itself comes from the private repo
          rsync -a --exclude tools --exclude package.json src/site/ _site/
          # domain, search-engine verification and icons stay in this repo
          cp site/CNAME site/yandex_*.html _site/
          rsync -a site/images/favicon _site/images/
          printf 'User-agent: *\nAllow: /\n' > _site/robots.txt
          # old /mockup/ links keep working
          mkdir -p _site/mockup
          printf '<!doctype html><meta charset="utf-8"><title>Velie</title><link rel="canonical" href="https://velie.ru/"><meta http-equiv="refresh" content="0; url=/"><a href="/">velie.ru</a>\n' > _site/mockup/index.html
          echo "site $(git -C src rev-parse --short HEAD)" > _site/version.txt
          touch _site/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
